# resources.toml - catalogue of papers and pages to download.
#
# This is the default resource list (black-box optimization & LLM tuning).
# Replace it for any other topic — the schema is dead simple:
#
#   [[resource]]
#   tier     = 1                # 1 = must-have, 2 = nice-to-have, 3 = reference
#   kind     = "pdf"            # "pdf" or "html"
#   filename = "Author-Year-Title.pdf"
#   url      = "https://..."
#   note     = "One-line description"
#
# Use any tier numbers you want — they're just filters. Convention:
#   1 = essential        (download_raw.py --tier 1 fetches only these)
#   2 = recommended
#   3 = nice-to-have / reference
#
# Run `download_raw.py --init my-topic.toml` to generate a starter template.

