# resources.toml - catalogue of papers and pages to download.
#
# This is the resource list for the ISP register optimization problem.
# Focused on: CMA-ES optimizer, XGBoost surrogate, sensitivity analysis, dimension reduction,
# multi-objective optimization, experimental design, surrogate validation, LLM code analysis,
# active learning, and ISP image quality metrics.
#
#   [[resource]]
#   tier     = 1                # 1 = must-have, 2 = nice-to-have, 3 = reference
#   kind     = "pdf"            # "pdf" or "html"
#   filename = "Author-Year-Title.pdf"
#   url      = "https://..."
#   note     = "One-line description"
#
# Tier convention:
#   1 = essential        (download_raw.py --tier 1 fetches only these)
#   2 = recommended
#   3 = reference / background

# =========================================================================
# Tier 1 — CMA-ES: exact algorithm and parameters
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Hansen-2016-CMA-ES-Tutorial.pdf"
url      = "https://arxiv.org/pdf/1604.00772"
note     = "THE CMA-ES implementation reference (Hansen 2016) — exact formulas for λ, μ, learning rates, evolution paths, CSA, termination criteria; read this before implementing"

# =========================================================================
# Tier 1 — Multi-objective optimization (MTF + false color + desaturation)
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Deb-2002-NSGA-II.pdf"
url      = "https://sci2s.ugr.es/sites/default/files/files/Teaching/OtherPostGraduateCourses/Metaheuristicas/Deb_NSGAII.pdf"
note     = "NSGA-II (Deb et al. 2002) — standard Pareto-front multi-objective optimizer; use when you want to see the explicit trade-off between MTF, false color, and desaturation rather than committing to a fixed weighted sum"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Daulton-2020-qEHVI.pdf"
url      = "https://arxiv.org/pdf/2006.05078"
note     = "qEHVI: differentiable expected hypervolume improvement for parallel multi-objective BO (NeurIPS 2020) — the state-of-the-art method if you want BO instead of evolutionary search for joint MTF/false-color/desaturation optimization"

# =========================================================================
# Tier 1 — Experimental design: how to collect the initial 300k runs
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "McKay-1979-LHS.pdf"
url      = "https://www.asc.ohio-state.edu/statistics/comp_exp/jour.club/McKayConoverBeckman.pdf"
note     = "Latin Hypercube Sampling (McKay, Beckman & Conover 1979) — space-filling design for 200D; if your 300k were random uniform, LHS with the same budget gives far better surrogate coverage — foundational for any future data collection rounds"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Sacks-1989-DACE.pdf"
url      = "https://www2.stat.duke.edu/courses/Spring14/sta961.01/ref/SackWelcMitcWynn1989.pdf"
note     = "DACE: Design and Analysis of Computer Experiments (Sacks et al. 1989) — the foundational paper for surrogate modeling of expensive black-box simulations; explains why space-filling design matters and how GP surrogates are built on it"

# =========================================================================
# Tier 1 — Surrogate validation: knowing when to trust XGBoost
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Iooss-2010-Q2-Metamodel-Validation.pdf"
url      = "https://arxiv.org/pdf/1001.1049"
note     = "Q2 metamodel validation (Iooss et al. 2010) — defines the Q2 predictivity coefficient (LOO cross-validation score 0→1) for surrogate models; gives you a concrete metric to assess XGBoost accuracy before trusting it to guide CMA-ES"

# =========================================================================
# Tier 1 — Must-have: directly supports the ISP optimization pipeline
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Lundberg-2017-SHAP.pdf"
url      = "https://arxiv.org/pdf/1705.07874"
note     = "SHAP: unified model-agnostic feature importance — more reliable than XGBoost gain importance for register sensitivity analysis"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Constantine-2014-Active-Subspaces.pdf"
url      = "https://arxiv.org/pdf/1304.2070"
note     = "Active subspace methods — principled dimension reduction for optimization; foundational for 200D → 20-40D register reduction"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Bartz-Beielstein-Surrogate-BBO.pdf"
url      = "https://www.lix.polytechnique.fr/~liberti/itor16.pdf"
note     = "Surrogate-based BBO: infill strategies, iterative retraining — theoretical foundation for the validation + retraining loop"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Loshchilov-2017-LM-MA-ES.pdf"
url      = "https://arxiv.org/pdf/1705.06693"
note     = "LM-MA-ES: O(n log n) CMA-ES variant for 200D+ problems — recommended optimizer for full search space"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Nomura-2024-CMA-ES-Learning-Rate.pdf"
url      = "https://arxiv.org/pdf/2401.15876"
note     = "LRA-CMA-ES: auto-adapts learning rate via SNR — handles noisy or multimodal IQ landscapes"

# =========================================================================
# Tier 1 — Dimension reduction / sensitivity analysis: exact methods
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Chen-2016-XGBoost.pdf"
url      = "https://arxiv.org/pdf/1603.02754"
note     = "XGBoost paper (Chen & Guestrin 2016) — explains the three built-in importance types: gain (contribution to metric), cover (samples affected), frequency (split count); gain is the right one for register ranking"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Lundberg-2018-TreeSHAP.pdf"
url      = "https://arxiv.org/pdf/1802.03888"
note     = "TreeSHAP: exact, fast SHAP values for tree models (XGBoost, LightGBM, RF) — directly run on your trained XGBoost to get per-register per-metric SHAP importance; more reliable than gain importance for correlated registers"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Herman-2017-SALib.pdf"
url      = "https://joss.theoj.org/papers/10.21105/joss.00097.pdf"
note     = "SALib: Python library implementing Morris screening + Sobol indices — two exact sensitivity analysis methods; Morris finds which registers matter with few runs, Sobol quantifies variance contribution per register"

# NOTE: Add when URL confirmed —
#   Campolongo, Cariboni & Saltelli 2007 "An effective screening design for sensitivity analysis
#   of large models" — Environmental Modelling & Software 22(10):1509–1518.
#   DOI: 10.1016/j.envsoft.2006.10.004 — improved Morris sampling that maximizes spread in
#   factor space; practical guide for screening 200 registers with few runs
#
#   Saltelli et al. 2010 "Variance based sensitivity analysis of model output"
#   Computer Physics Communications 181(2):259–270. DOI: 10.1016/j.cpc.2009.09.018
#   — standard Sobol total-index estimator formula used in SALib
#
#   Saltelli et al. 2008 "Global Sensitivity Analysis: The Primer" (Wiley book)
#   THE practical reference; covers Morris, Sobol, FAST with worked examples and Python code

# =========================================================================
# Tier 1 — LLM code analysis: extracting register info from C++ source
# =========================================================================

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Wei-2022-Chain-of-Thought.pdf"
url      = "https://arxiv.org/pdf/2201.11903"
note     = "Chain-of-Thought prompting — foundational for prompting LLMs to reason step-by-step; directly relevant to structured register extraction (ranges, dead zones, thresholds) from C++ code"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Roziere-2023-CodeLlama.pdf"
url      = "https://arxiv.org/pdf/2308.12950"
note     = "Code Llama: code-specialized LLM (Meta 2023) — outperforms general LLMs on C++ analysis tasks; better choice than GPT-4 for ISP block file analysis"

[[resource]]
tier     = 1
kind     = "pdf"
filename = "Hou-2023-LLMs-for-SE.pdf"
url      = "https://arxiv.org/pdf/2308.10620"
note     = "Survey: LLMs for Software Engineering (2023) — covers code understanding, summarization, information extraction; maps what LLMs can and cannot reliably do on source code"

