# =========================================================================
# Tier 2 — Active learning: theoretical foundation for the retraining loop
# =========================================================================

[[resource]]
tier     = 2
kind     = "pdf"
filename = "Settles-2009-Active-Learning-Survey.pdf"
url      = "http://burrsettles.com/pub/settles.activelearning.pdf"
note     = "Active Learning Literature Survey (Settles 2009) — full taxonomy of adaptive sampling strategies; your validation→disagreement→targeted sampling loop is query-by-committee active learning; this gives the theoretical framing"

# =========================================================================
# Tier 2 — IQ metrics: what MTF and false color actually measure
# =========================================================================

[[resource]]
tier     = 2
kind     = "pdf"
filename = "Burns-2000-Slanted-Edge-MTF.pdf"
