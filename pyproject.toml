[project]
name = "bbo-vault"
version = "0.1.0"
description = "Black-box optimization & LLM tuning second-brain — ingestion scripts and distilled notes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

# Runtime dependencies for high-quality conversion.
# The scripts also run with zero deps (stdlib fallbacks), but installing
# these gives publication-quality markdown output.
dependencies = [
    "pymupdf4llm>=0.0.17",   # best PDF -> markdown
    "trafilatura>=1.12.0",   # best HTML -> markdown
]

[dependency-groups]
# Lighter alternatives, used automatically as fallbacks if the main deps
# are missing. Useful as a sanity-check group for the fallback paths.
fallback = [
    "pypdf>=4.0.0",
    "markdownify>=0.13.0",
    "beautifulsoup4>=4.12.0",
]

[tool.uv]
# Keep the lockfile cross-platform and exclude editable installs by default.
package = false
